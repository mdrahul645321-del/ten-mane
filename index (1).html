<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c4dff"><title>TEN MANE</title>
<style>
:root{--bg:#f4f1ff;--card:#fff;--tx:#241c3a;--mu:#7a7094;--p:#7c4dff;--p2:#ff6b9d;--ok:#12b886;--bad:#f03e3e}
@media(prefers-color-scheme:dark){:root{--bg:#171326;--card:#241e3b;--tx:#f1ecff;--mu:#a99fc6}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans Bengali",sans-serif;padding-bottom:84px}
header{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:calc(16px + env(safe-area-inset-top)) 16px 18px;border-radius:0 0 24px 24px;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:22px;letter-spacing:2px}main{padding:14px;max-width:560px;margin:auto}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 4px 14px #7c4dff22;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
h2{font-size:16px;margin:0 0 8px}.mu{color:var(--mu);font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 14px #0002}
nav button{flex:1;border:0;background:none;color:var(--mu);font-size:11px}nav b{display:block;font-size:20px}nav .on{color:var(--p);font-weight:700}
input,select,textarea{font:inherit;padding:10px;border-radius:12px;border:1px solid #7c4dff44;background:var(--bg);color:var(--tx);width:100%;margin:4px 0}
.btn{font:inherit;padding:10px;border-radius:12px;border:0;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:700;width:100%;margin:4px 0}
.sm{width:auto;padding:5px 11px;font-size:13px;margin:0 0 0 5px}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #7c4dff18;gap:6px}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;color:#fff}.ok{background:var(--ok)}.bad{background:var(--bad)}
.ph{width:100%;border-radius:12px;margin-top:6px}a{color:var(--p)}
</style></head><body>
<header><h1>TEN MANE 🏠</h1><span id="who" class="mu" style="color:#fff"></span></header>
<main id="m"></main><nav id="nav"></nav>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import{getFirestore,collection,doc,setDoc,addDoc,updateDoc,deleteDoc,onSnapshot,query,where,getDocs}from"https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyAhv2NEilZ6EniYHazYr855PJzxG4nCGXw",authDomain:"ten-mane.firebaseapp.com",projectId:"ten-mane",storageBucket:"ten-mane.firebasestorage.app",messagingSenderId:"753037428756",appId:"1:753037428756:web:ffbc779a6b54989e9cff01"});
const auth=getAuth(app),db=getFirestore(app);
const S={tab:'home',users:[],fines:[],deps:[],proofs:[],ann:[],set:null,uid:null,subs:[],mode:'in'};
const $=s=>document.querySelector(s),W=window;
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10),mon=()=>today().slice(0,7);
const isA=()=>S.set&&S.set.adminUid===S.uid;
const nm=id=>(S.users.find(u=>u.id===id)||{}).name||'অজানা';
const act=()=>S.users.filter(u=>u.active!==false).sort((a,b)=>a.order-b.order);
const fmt=t=>new Date(t).toLocaleString('bn-BD',{dateStyle:'short',timeStyle:'short'});
function duty(off=0){const a=act();if(!a.length||!S.set||!S.set.start)return null;const d=Math.floor((new Date(today())-new Date(S.set.start))/864e5)+off;if(d<0)return null;return{k:a[d%a.length],t:a[(d+1)%a.length]}}
const run=async f=>{try{await f()}catch(e){alert('কাজ হয়নি: '+(e.code||e.message))}};
const tabs=[['home','🏠','হোম'],['duty','🧹','ডিউটি'],['proof','📸','প্রুফ'],['fine','💸','ফাইন'],['dep','🏦','ডিপজিট'],['mem','👥','সদস্য']];
function login(){$('#nav').innerHTML='';$('#who').textContent='';
$('#m').innerHTML=`<div class="card"><h2>${S.mode==='in'?'লগইন':'নতুন অ্যাকাউন্ট'}</h2>${S.mode==='up'?'<input id="n" placeholder="তোমার নাম">':''}<input id="e" type="email" placeholder="ইমেইল"><input id="p" type="password" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)"><button class="btn" onclick="auth_()">${S.mode==='in'?'ঢোকো':'তৈরি করো'}</button><p class="mu" onclick="S.mode=S.mode==='in'?'up':'in';login()" style="text-align:center">${S.mode==='in'?'অ্যাকাউন্ট নেই? নতুন বানাও':'আগে থেকে আছে? লগইন'}</p></div>`}
W.S=S;W.login=login;
W.auth_=()=>run(async()=>{const e=$('#e').value.trim(),p=$('#p').value;
if(S.mode==='in')await signInWithEmailAndPassword(auth,e,p);else{const n=$('#n').value.trim();if(!n)return alert('নাম দাও');const c=await createUserWithEmailAndPassword(auth,e,p);await setDoc(doc(db,'users',c.user.uid),{name:n,order:Date.now(),active:true})}});
function render(){if(!S.uid)return login();
const me=S.users.find(u=>u.id===S.uid);if(!S.set&&!S.ready)return;
if(S.uloaded&&!me){$('#nav').innerHTML='';$('#m').innerHTML=`<div class="card"><h2>তোমার নাম লেখো</h2><input id="nn" placeholder="তোমার নাম"><button class="btn" onclick="saveName()">সেভ</button></div>`;return}
if(!S.set){$('#m').innerHTML=`<div class="card"><h2>প্রথম সেটআপ</h2><p class="mu">তুমিই প্রথম, তাই তুমি অ্যাডমিন হবে।</p><button class="btn" onclick="mkAdmin()">অ্যাডমিন হও</button></div>`;return}
$('#who').textContent=(me?me.name:'')+' · '+(isA()?'অ্যাডমিন':'সদস্য');
$('#nav').innerHTML=tabs.map(t=>`<button class="${S.tab===t[0]?'on':''}" onclick="S.tab='${t[0]}';render()"><b>${t[1]}</b>${t[2]}</button>`).join('');
$('#m').innerHTML=V[S.tab]()}
W.render=render;
W.mkAdmin=()=>run(()=>setDoc(doc(db,'settings','main'),{adminUid:S.uid,start:today(),amount:0,place:''}));
const V={
home(){const d=duty(),my=S.fines.filter(f=>f.uid===S.uid&&!f.paid).reduce((s,f)=>s+f.amt,0),dep=S.deps.find(x=>x.uid===S.uid&&x.month===mon());
return `<div class="card"><h2>আজকের ডিউটি</h2>${d?`<div class="row"><span>🍳 রান্নাঘর</span><b>${esc(d.k.name)}</b></div><div class="row"><span>🚽 টয়লেট</span><b>${esc(d.t.name)}</b></div>`:'<p class="mu">ডিউটি ঠিক হয়নি</p>'}</div>
<div class="card"><h2>আমার বকেয়া ফাইন</h2><b style="font-size:22px">${my.toFixed(3)} KWD</b></div>
<div class="card"><h2>এই মাসের ডিপজিট</h2>${dep?'<span class="tag ok">জমা দিয়েছি</span>':'<span class="tag bad">বাকি</span>'}<p class="mu">${S.set.amount||''} KWD ${esc(S.set.place||'')}</p></div>
<div class="card"><h2>📢 ঘোষণা</h2>${isA()?'<textarea id="pt" rows="2" placeholder="নতুন ঘোষণা"></textarea><button class="btn" onclick="post()">পাঠাও</button>':''}${S.ann.sort((a,b)=>b.ts-a.ts).slice(0,8).map(p=>`<div class="row"><span>${esc(p.text)}<br><small class="mu">${fmt(p.ts)}</small></span>${isA()?`<button class="btn sm" onclick="del('ann','${p.id}')">✕</button>`:''}</div>`).join('')||'<p class="mu">কিছু নেই</p>'}</div>
<button class="btn" onclick="signOutX()" style="background:#888">লগআউট</button>`},
duty(){let r='';for(let i=0;i<7;i++){const d=duty(i);if(d)r+=`<div class="row"><span>${new Date(Date.now()+i*864e5).toLocaleDateString('bn-BD')}</span><span>🍳 ${esc(d.k.name)} · 🚽 ${esc(d.t.name)}</span></div>`}
return `<div class="card"><h2>আগামী ৭ দিন</h2>${r||'<p class="mu">শুরুর তারিখ নেই</p>'}</div>`+(isA()?`<div class="card"><h2>মাসের শুরুর তারিখ</h2><input type="date" id="sd" value="${S.set.start||''}"><button class="btn" onclick="sset({start:$('#sd').value})">সেভ</button></div>`:'')},
proof(){const list=S.proofs.sort((a,b)=>b.ts-a.ts);
return `<div class="card"><h2>প্রুফ দাও</h2><select id="sp"><option>রান্নাঘর</option><option>টয়লেট</option></select><input type="file" id="pf" accept="image/*"><button class="btn" onclick="upl()">আপলোড</button><p class="mu">ছবি ৭ দিন পর নিজে মুছে যাবে</p></div>`+
list.map(p=>`<div class="card"><b>${esc(nm(p.uid))}</b> · ${esc(p.spot)}<br><small class="mu">${fmt(p.ts)}</small><img class="ph" src="${p.img}">${isA()||p.uid===S.uid?`<button class="btn sm" onclick="del('proofs','${p.id}')">মুছো</button>`:''}</div>`).join('')},
fine(){const L=S.fines.sort((a,b)=>b.ts-a.ts),un=L.filter(f=>!f.paid).reduce((s,f)=>s+f.amt,0),pd=L.filter(f=>f.paid).reduce((s,f)=>s+f.amt,0);
return `<div class="card"><h2>সারসংক্ষেপ</h2><div class="row"><span>বকেয়া</span><b>${un.toFixed(3)} KWD</b></div><div class="row"><span>পরিশোধিত</span><b>${pd.toFixed(3)} KWD</b></div></div>`+
(isA()?`<div class="card"><h2>নতুন ফাইন</h2><select id="fm">${act().map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select><input id="fa" type="number" step="0.001" placeholder="পরিমাণ (KWD)"><input id="fr" placeholder="কারণ"><button class="btn" onclick="addFine()">ফাইন দাও</button></div>`:'')+
`<div class="card"><h2>তালিকা</h2>${L.map(f=>`<div class="row"><span>${isA()?esc(nm(f.uid))+' · ':''}${esc(f.reason)}<br><small class="mu">${f.date}</small></span><span><b>${f.amt.toFixed(3)}</b> <span class="tag ${f.paid?'ok':'bad'}">${f.paid?'পরিশোধ':'বাকি'}</span>${isA()?`<button class="btn sm" onclick="payF('${f.id}',${!f.paid})">${f.paid?'↩':'✔'}</button><button class="btn sm" onclick="del('fines','${f.id}')">✕</button>`:''}</span></div>`).join('')||'<p class="mu">কিছু নেই</p>'}</div>`},
dep(){const cur=S.deps.filter(x=>x.month===mon()),mine=cur.find(x=>x.uid===S.uid);
return `<div class="card"><h2>${mon()} মাসের ডিপজিট</h2><p><b>${S.set.amount||'?'} KWD</b><br><span class="mu">${esc(S.set.place||'জমার জায়গা ঠিক হয়নি')}</span></p>${mine?'<span class="tag ok">জমা দিয়েছি</span>':'<input id="dn" placeholder="নোট"><button class="btn" onclick="sendD()">জমা দিয়েছি</button>'}</div>`+
(isA()?`<div class="card"><h2>অ্যাডমিন সেটিংস</h2><input id="da" type="number" step="0.001" placeholder="মাসিক পরিমাণ (KWD)" value="${S.set.amount||''}"><input id="dp" placeholder="কোথায় জমা" value="${esc(S.set.place||'')}"><button class="btn" onclick="sset({amount:+$('#da').value,place:$('#dp').value})">সেভ</button></div>`:'')+
`<div class="card"><h2>অবস্থা</h2>${act().map(m=>{const d=cur.find(x=>x.uid===m.id);return `<div class="row"><span>${esc(m.name)}</span><span class="tag ${d?'ok':'bad'}">${d?'জমা':'বাকি'}</span></div>`}).join('')}</div>`},
mem(){return `<div class="card"><h2>সদস্য (${act().length})</h2>${S.users.sort((a,b)=>a.order-b.order).map((m,i)=>`<div class="row"><span>${i+1}. ${esc(m.name)}</span>${isA()&&m.id!==S.uid?`<button class="btn sm" onclick="tog('${m.id}',${m.active===false})">${m.active===false?'চালু':'বন্ধ'}</button>`:''}</div>`).join('')}</div><div class="card mu">নতুন সদস্য এই অ্যাপের লিংক খুলে "নতুন অ্যাকাউন্ট" বানাবে।</div>`}};
W.saveName=()=>run(()=>{const n=$('#nn').value.trim();if(!n)return alert('নাম দাও');return setDoc(doc(db,'users',S.uid),{name:n,order:Date.now(),active:true})});
W.signOutX=()=>signOut(auth);
W.sset=o=>run(()=>updateDoc(doc(db,'settings','main'),o));
W.post=()=>run(()=>{const t=$('#pt').value.trim();if(t)return addDoc(collection(db,'ann'),{text:t,ts:Date.now()})});
W.del=(c,id)=>confirm('মুছবে?')&&run(()=>deleteDoc(doc(db,c,id)));
W.addFine=()=>run(()=>{const a=parseFloat($('#fa').value);if(!(a>0))return alert('সঠিক পরিমাণ দাও');return addDoc(collection(db,'fines'),{uid:$('#fm').value,amt:a,reason:$('#fr').value||'—',date:today(),ts:Date.now(),paid:false})});
W.payF=(id,v)=>run(()=>updateDoc(doc(db,'fines',id),{paid:v}));
W.sendD=()=>run(()=>setDoc(doc(db,'deposits',S.uid+'_'+mon()),{uid:S.uid,month:mon(),note:$('#dn').value||'',ts:Date.now()}));
W.tog=(id,v)=>run(()=>updateDoc(doc(db,'users',id),{active:v}));
W.upl=()=>run(async()=>{const f=$('#pf').files[0];if(!f)return alert('ছবি বাছো');
const im=await createImageBitmap(f),k=Math.min(1,720/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
await addDoc(collection(db,'proofs'),{uid:S.uid,spot:$('#sp').value,img:c.toDataURL('image/jpeg',.6),ts:Date.now()});alert('আপলোড হয়েছে ✅')});
const sub=(q,k)=>S.subs.push(onSnapshot(q,s=>{S[k]=s.docs.map(d=>({id:d.id,...d.data()}));if(k==='users')S.uloaded=true;render()},e=>console.log(k,e.code)));
onAuthStateChanged(auth,u=>{S.subs.forEach(f=>f());S.subs=[];S.uid=u?u.uid:null;S.set=null;S.ready=false;S.uloaded=false;
if(!u)return render();
S.subs.push(onSnapshot(doc(db,'settings','main'),s=>{S.set=s.exists()?s.data():null;S.ready=true;render();
 if(S.set&&S.set.adminUid===S.uid&&!S.cleaned){S.cleaned=1;getDocs(query(collection(db,'proofs'),where('ts','<',Date.now()-7*864e5))).then(r=>r.forEach(d=>deleteDoc(d.ref)))}}));
sub(collection(db,'users'),'users');sub(collection(db,'ann'),'ann');sub(collection(db,'proofs'),'proofs');
sub(collection(db,'deposits'),'deps');
S.subs.push(onSnapshot(doc(db,'settings','main'),s=>{const a=s.exists()&&s.data().adminUid===u.uid;
 sub(a?collection(db,'fines'):query(collection(db,'fines'),where('uid','==',u.uid)),'fines')}));});
render();
</script></body></html>
